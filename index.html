<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Calculadora Puerto Rico • Synthwave</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;500;600;700;800;900&family=Share+Tech+Mono&display=swap');

  :root {
    --neon-pink: #ff2a6d;
    --neon-cyan: #05d9e8;
    --neon-green: #01ff70;
    --neon-purple: #d300c5;
    --bg-dark: #0a0015;
    --screen-bg: #001a0f;
  }

  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
  }

  body {
    min-height: 100vh;
    background: var(--bg-dark);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Orbitron', sans-serif;
    overflow-x: hidden;
    position: relative;
  }

  /* ========== ANIMATED SYNTHWAVE BACKGROUND ========== */
  .bg-grid {
    position: fixed;
    inset: 0;
    background: 
      linear-gradient(transparent 0%, rgba(5,217,232,0.03) 50%, transparent 100%),
      linear-gradient(90deg, transparent 0%, rgba(255,42,109,0.03) 50%, transparent 100%);
    background-size: 60px 60px;
    transform: perspective(500px) rotateX(60deg) translateY(-80px) scale(1.8);
    animation: gridMove 20s linear infinite;
    z-index: 0;
    opacity: 0.7;
  }

  @keyframes gridMove {
    0% { background-position: 0 0; }
    100% { background-position: 0 60px; }
  }

  .stars {
    position: fixed;
    inset: 0;
    background-image: 
      radial-gradient(1px 1px at 20px 30px, #fff, transparent),
      radial-gradient(1px 1px at 40px 70px, rgba(5,217,232,0.8), transparent),
      radial-gradient(1.5px 1.5px at 90px 40px, #ff2a6d, transparent),
      radial-gradient(1px 1px at 130px 80px, #fff, transparent),
      radial-gradient(1.2px 1.2px at 160px 120px, rgba(1,255,112,0.7), transparent);
    background-size: 200px 200px;
    animation: twinkle 8s ease-in-out infinite alternate;
    z-index: 0;
  }

  @keyframes twinkle {
    0% { opacity: 0.4; }
    100% { opacity: 0.9; }
  }

  .scanlines {
    position: fixed;
    inset: 0;
    background: repeating-linear-gradient(
      0deg,
      transparent,
      transparent 2px,
      rgba(0,0,0,0.15) 2px,
      rgba(0,0,0,0.15) 4px
    );
    pointer-events: none;
    z-index: 10;
  }

  /* ========== CALCULATOR ========== */
  .calculator {
    position: relative;
    width: 380px;
    max-width: 95vw;
    background: linear-gradient(180deg, #12001f 0%, #0a0015 100%);
    border: 3px solid var(--neon-pink);
    border-radius: 24px;
    padding: 16px;
    box-shadow: 
      0 0 15px var(--neon-pink),
      0 0 40px rgba(255,42,109,0.4),
      inset 0 0 30px rgba(255,42,109,0.1);
    z-index: 5;
    animation: borderPulse 3s ease-in-out infinite;
  }

  @keyframes borderPulse {
    0%, 100% { box-shadow: 0 0 15px var(--neon-pink), 0 0 40px rgba(255,42,109,0.4); }
    50% { box-shadow: 0 0 25px var(--neon-pink), 0 0 60px rgba(255,42,109,0.6), 0 0 80px rgba(5,217,232,0.3); }
  }

  /* Header */
  .header {
    display: flex;
    align-items: center;
    justify-content: space-between;
    margin-bottom: 12px;
    padding: 0 4px;
  }

  .header-left {
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .flag {
    width: 32px;
    height: 22px;
    background: linear-gradient(to bottom, #ed0000 0 33%, #fff 33% 66%, #ed0000 66%);
    position: relative;
    border-radius: 2px;
    box-shadow: 0 0 8px rgba(255,42,109,0.6);
  }
  .flag::before {
    content: '';
    position: absolute;
    left: 0; top: 0; bottom: 0;
    width: 40%;
    background: #0050f0;
  }
  .flag::after {
    content: '★';
    position: absolute;
    left: 6px; top: 3px;
    color: white;
    font-size: 10px;
  }

  .title {
    font-size: 18px;
    font-weight: 800;
    color: var(--neon-pink);
    text-shadow: 0 0 10px var(--neon-pink);
    letter-spacing: 1px;
  }
  .subtitle {
    font-size: 10px;
    color: var(--neon-cyan);
    letter-spacing: 3px;
    text-shadow: 0 0 6px var(--neon-cyan);
  }

  .battery {
    font-size: 11px;
    color: var(--neon-green);
    display: flex;
    align-items: center;
    gap: 4px;
  }
  .battery-icon {
    width: 22px;
    height: 12px;
    border: 1px solid var(--neon-green);
    border-radius: 2px;
    position: relative;
  }
  .battery-icon::after {
    content: '';
    position: absolute;
    right: -3px; top: 3px;
    width: 2px; height: 6px;
    background: var(--neon-green);
  }
  .battery-level {
    position: absolute;
    left: 1px; top: 1px; bottom: 1px;
    width: 85%;
    background: var(--neon-green);
    box-shadow: 0 0 6px var(--neon-green);
  }

  /* Screen */
  .screen {
    background: var(--screen-bg);
    border: 2px solid var(--neon-green);
    border-radius: 12px;
    padding: 12px;
    margin-bottom: 12px;
    box-shadow: 
      0 0 15px rgba(1,255,112,0.3),
      inset 0 0 20px rgba(0,0,0,0.8);
    position: relative;
    overflow: hidden;
    min-height: 260px;
  }

  .screen::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(180deg, transparent 50%, rgba(1,255,112,0.03) 50%);
    background-size: 100% 4px;
    pointer-events: none;
  }

  .mode-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
  }
  .mode {
    color: var(--neon-green);
    font-size: 13px;
    font-weight: 700;
    display: flex;
    align-items: center;
    gap: 6px;
    text-shadow: 0 0 8px var(--neon-green);
  }
  .dots {
    color: var(--neon-cyan);
    letter-spacing: 3px;
  }

  .list-title {
    color: var(--neon-cyan);
    font-size: 11px;
    margin: 6px 0 4px;
    letter-spacing: 1px;
  }

  .items {
    max-height: 90px;
    overflow-y: auto;
    margin-bottom: 8px;
    font-family: 'Share Tech Mono', monospace;
  }
  .item {
    display: flex;
    justify-content: space-between;
    color: #a0ffa0;
    font-size: 13px;
    padding: 2px 0;
    border-bottom: 1px dashed rgba(1,255,112,0.15);
  }
  .item .name { color: #c0ffc0; }
  .item .price { color: var(--neon-green); }

  .breakdown {
    font-size: 12px;
    font-family: 'Share Tech Mono', monospace;
  }
  .row {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 3px 0;
  }
  .row .label {
    display: flex;
    align-items: center;
    gap: 6px;
  }
  .icon { font-size: 14px; }

  .serrucho { color: #7fff7f; }
  .descuento { color: #ff6b9d; }
  .propina { color: #ff85a2; }
  .ivu { color: #c77dff; }

  .total-row {
    margin-top: 8px;
    padding-top: 8px;
    border-top: 1px solid rgba(1,255,112,0.3);
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .total-label {
    font-size: 18px;
    font-weight: 800;
    color: var(--neon-green);
    text-shadow: 0 0 12px var(--neon-green);
  }
  .total-value {
    font-size: 26px;
    font-weight: 900;
    color: var(--neon-green);
    text-shadow: 0 0 15px var(--neon-green), 0 0 30px rgba(1,255,112,0.5);
    animation: totalGlow 2s ease-in-out infinite;
  }

  @keyframes totalGlow {
    0%, 100% { text-shadow: 0 0 15px var(--neon-green); }
    50% { text-shadow: 0 0 25px var(--neon-green), 0 0 40px rgba(1,255,112,0.7); }
  }

  /* Input */
  .input-box {
    background: rgba(0,20,40,0.8);
    border: 2px solid var(--neon-cyan);
    border-radius: 10px;
    padding: 10px 14px;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 8px;
    box-shadow: 0 0 12px rgba(5,217,232,0.3);
  }
  .input-box label {
    color: var(--neon-cyan);
    font-size: 12px;
    font-weight: 600;
    white-space: nowrap;
  }
  #display {
    flex: 1;
    background: transparent;
    border: none;
    color: white;
    font-family: 'Share Tech Mono', monospace;
    font-size: 22px;
    text-align: right;
    outline: none;
    text-shadow: 0 0 8px var(--neon-cyan);
  }

  /* Function buttons */
  .func-row {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }

  .func-btn {
    background: rgba(20,0,40,0.9);
    border: 2px solid;
    border-radius: 12px;
    padding: 10px 4px;
    color: white;
    font-family: 'Orbitron', sans-serif;
    font-size: 10px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 4px;
    transition: all 0.2s;
    position: relative;
    overflow: hidden;
  }
  .func-btn::before {
    content: '';
    position: absolute;
    inset: 0;
    background: linear-gradient(135deg, transparent, rgba(255,255,255,0.1), transparent);
    opacity: 0;
    transition: opacity 0.3s;
  }
  .func-btn:hover::before { opacity: 1; }
  .func-btn:active {
    transform: scale(0.95);
  }

  .func-btn.serrucho { border-color: #7fff7f; color: #7fff7f; box-shadow: 0 0 10px rgba(127,255,127,0.3); }
  .func-btn.propina  { border-color: #ff85a2; color: #ff85a2; box-shadow: 0 0 10px rgba(255,133,162,0.3); }
  .func-btn.descuento{ border-color: #ff6b9d; color: #ff6b9d; box-shadow: 0 0 10px rgba(255,107,157,0.3); }
  .func-btn.ivu      { border-color: #c77dff; color: #c77dff; box-shadow: 0 0 10px rgba(199,125,255,0.3); }

  .func-btn:hover {
    filter: brightness(1.3);
    box-shadow: 0 0 20px currentColor;
  }

  .func-btn .val {
    font-size: 13px;
    font-weight: 700;
  }

  /* Number pad */
  .pad {
    display: grid;
    grid-template-columns: repeat(4, 1fr);
    gap: 8px;
    margin-bottom: 12px;
  }

  .key {
    background: rgba(10,0,30,0.95);
    border: 2px solid var(--neon-cyan);
    border-radius: 12px;
    height: 52px;
    color: white;
    font-family: 'Orbitron', sans-serif;
    font-size: 20px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.15s;
    box-shadow: 0 0 8px rgba(5,217,232,0.2);
    position: relative;
  }
  .key:hover {
    background: rgba(5,217,232,0.15);
    box-shadow: 0 0 18px var(--neon-cyan), 0 0 30px rgba(5,217,232,0.4);
    text-shadow: 0 0 10px var(--neon-cyan);
    transform: translateY(-2px);
  }
  .key:active {
    transform: scale(0.92);
    box-shadow: 0 0 25px var(--neon-cyan);
  }

  .key.op {
    border-color: var(--neon-pink);
    color: var(--neon-pink);
    box-shadow: 0 0 8px rgba(255,42,109,0.25);
  }
  .key.op:hover {
    background: rgba(255,42,109,0.15);
    box-shadow: 0 0 18px var(--neon-pink);
    text-shadow: 0 0 10px var(--neon-pink);
  }

  .key.zero { grid-column: span 1; }

  /* Bottom buttons */
  .bottom-row {
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .bottom-btn {
    background: rgba(15,0,35,0.9);
    border: 2px solid var(--neon-purple);
    border-radius: 12px;
    padding: 10px 2px;
    color: #e0a0ff;
    font-family: 'Orbitron', sans-serif;
    font-size: 9px;
    font-weight: 600;
    cursor: pointer;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 3px;
    transition: all 0.2s;
  }
  .bottom-btn:hover {
    background: rgba(211,0,197,0.2);
    box-shadow: 0 0 15px var(--neon-purple);
    color: white;
    transform: translateY(-2px);
  }
  .bottom-btn:active { transform: scale(0.93); }
  .bottom-btn .icon { font-size: 16px; }

  .footer {
    text-align: center;
    margin-top: 12px;
    font-size: 10px;
    color: var(--neon-pink);
    letter-spacing: 1px;
    text-shadow: 0 0 6px var(--neon-pink);
  }

  /* Theme variants */
  body.theme-cyan {
    --neon-pink: #05d9e8;
    --neon-cyan: #ff2a6d;
  }
  body.theme-green {
    --neon-pink: #01ff70;
    --neon-cyan: #05d9e8;
  }

  /* Scrollbar */
  .items::-webkit-scrollbar { width: 4px; }
  .items::-webkit-scrollbar-thumb { background: var(--neon-green); border-radius: 4px; }

  /* Modal simple */
  .modal {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.85);
    z-index: 100;
    justify-content: center;
    align-items: center;
  }
  .modal.active { display: flex; }
  .modal-content {
    background: #12001f;
    border: 2px solid var(--neon-cyan);
    border-radius: 16px;
    padding: 24px;
    width: 300px;
    text-align: center;
    box-shadow: 0 0 30px var(--neon-cyan);
  }
  .modal-content h3 {
    color: var(--neon-cyan);
    margin-bottom: 16px;
  }
  .modal-content input {
    width: 100%;
    padding: 10px;
    background: #000;
    border: 1px solid var(--neon-cyan);
    color: white;
    font-size: 18px;
    text-align: center;
    border-radius: 8px;
    margin-bottom: 16px;
    outline: none;
  }
  .modal-btns {
    display: flex;
    gap: 10px;
  }
  .modal-btns button {
    flex: 1;
    padding: 10px;
    border: none;
    border-radius: 8px;
    font-family: 'Orbitron';
    font-weight: 600;
    cursor: pointer;
  }
  .btn-ok { background: var(--neon-green); color: #000; }
  .btn-cancel { background: #333; color: white; }
</style>
</head>
<body>

<div class="bg-grid"></div>
<div class="stars"></div>
<div class="scanlines"></div>

<div class="calculator">
  <!-- Header -->
  <div class="header">
    <div class="header-left">
      <div class="flag"></div>
      <div>
        <div class="title">CALCULADORA</div>
        <div class="subtitle">PUERTO RICO</div>
      </div>
    </div>
    <div class="battery">
      <span id="battery-text">100%</span>
      <div class="battery-icon"><div class="battery-level"></div></div>
    </div>
  </div>

  <!-- Screen -->
  <div class="screen">
    <div class="mode-bar">
      <div class="mode"><span id="mode-icon">🛒</span> <span id="mode-text">MODO: COMPRAS</span></div>
      <div class="dots">•••</div>
    </div>

    <div class="list-title">☰ LISTA DE COMPRAS</div>
    <div class="items" id="item-list">
      <!-- items dinámicos -->
    </div>

    <div class="breakdown">
      <div class="row serrucho">
        <span class="label"><span class="icon">🪓</span> SERRAUCHO</span>
        <span id="serrucho-val">$0.00</span>
      </div>
      <div class="row descuento">
        <span class="label"><span class="icon">🏷</span> DESCUENTO</span>
        <span id="descuento-val">$0.00</span>
      </div>
      <div class="row propina">
        <span class="label"><span class="icon">💖</span> PROPINA</span>
        <span id="propina-val">$0.00</span>
      </div>
      <div class="row ivu">
        <span class="label"><span class="icon">%</span> IVU</span>
        <span id="ivu-val">$0.00</span>
      </div>

      <div class="total-row">
        <span class="total-label">TOTAL</span>
        <span class="total-value" id="total">$0.00</span>
      </div>
    </div>

    <!-- Input -->
    <div class="input-box">
      <label>$ INGRESA MONTO</label>
      <input type="text" id="display" value="0" readonly>
    </div>

    <!-- Function buttons -->
    <div class="func-row">
      <button class="func-btn serrucho" onclick="cycleSerrucho()">
        <span>🪚</span>
        <span>SERRAUCHO</span>
        <span class="val" id="serrucho-btn">N/A</span>
      </button>
      <button class="func-btn propina" onclick="cyclePropina()">
        <span>💖</span>
        <span>PROPINA</span>
        <span class="val" id="propina-btn">0%</span>
      </button>
      <button class="func-btn descuento" onclick="cycleDescuento()">
        <span>🏷️</span>
        <span>DESCUENTO</span>
        <span class="val" id="descuento-btn">0%</span>
      </button>
      <button class="func-btn ivu" onclick="toggleIVU()">
        <span>%</span>
        <span>IVU</span>
        <span class="val" id="ivu-btn">11.5%</span>
      </button>
    </div>

    <!-- Number Pad -->
    <div class="pad">
      <button class="key" onclick="appendNumber('7')">7</button>
      <button class="key" onclick="appendNumber('8')">8</button>
      <button class="key" onclick="appendNumber('9')">9</button>
      <button class="key op" onclick="setOperator('÷')">÷</button>

      <button class="key" onclick="appendNumber('4')">4</button>
      <button class="key" onclick="appendNumber('5')">5</button>
      <button class="key" onclick="appendNumber('6')">6</button>
      <button class="key op" onclick="setOperator('×')">×</button>

      <button class="key" onclick="appendNumber('1')">1</button>
      <button class="key" onclick="appendNumber('2')">2</button>
      <button class="key" onclick="appendNumber('3')">3</button>
      <button class="key op" onclick="setOperator('-')">−</button>

      <button class="key" onclick="appendNumber('.')">.</button>
      <button class="key" onclick="appendNumber('0')">0</button>
      <button class="key" onclick="backspace()">←</button>
      <button class="key op" onclick="addItem()">+</button>
    </div>

    <!-- Bottom buttons -->
    <div class="bottom-row">
      <button class="bottom-btn" onclick="cycleTheme()">
        <span class="icon">🎨</span>
        TEMA
      </button>
      <button class="bottom-btn" onclick="openConversion()">
        <span class="icon">🌐</span>
        CONV.
      </button>
      <button class="bottom-btn" onclick="generateReceipt()">
        <span class="icon">🧾</span>
        RECIBO
      </button>
      <button class="bottom-btn" onclick="openSalary()">
        <span class="icon">💰</span>
        SALARIO
      </button>
      <button class="bottom-btn" onclick="clearAll()">
        <span class="icon">🗑️</span>
        CLEAR
      </button>
    </div>

    <div class="footer">HECHO EN PUERTO RICO 🇵🇷 ♥</div>
  </div>

  <!-- Modal para Serrucho / Propina / Descuento / Conversión / Salario -->
  <div class="modal" id="modal">
    <div class="modal-content">
      <h3 id="modal-title">Ajustar</h3>
      <input type="number" id="modal-input" step="any">
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeModal()">Cancelar</button>
        <button class="btn-ok" onclick="confirmModal()">OK</button>
      </div>
    </div>
  </div>

  <!-- Modal Recibo -->
  <div class="modal" id="receipt-modal">
    <div class="modal-content" style="width:340px; text-align:left;">
      <h3 style="text-align:center;">🧾 RECIBO</h3>
      <pre id="receipt-text" style="font-family:'Share Tech Mono',monospace; font-size:13px; color:#a0ffa0; white-space:pre-wrap; max-height:300px; overflow-y:auto;"></pre>
      <div class="modal-btns">
        <button class="btn-cancel" onclick="closeReceipt()">Cerrar</button>
        <button class="btn-ok" onclick="copyReceipt()">Copiar</button>
      </div>
    </div>
  </div>

<script>
  // ========== STATE ==========
  let items = [];
  let currentInput = '0';
  let operator = null;
  let previousValue = null;
  let serrucho = 1;          // 1 = N/A
  let propinaPct = 0;
  let descuentoPct = 0;
  let ivuEnabled = true;
  const IVU_RATE = 0.115;
  let themeIndex = 0;
  const themes = ['', 'theme-cyan', 'theme-green'];
  let modalMode = null; // 'serrucho' | 'propina' | 'descuento' | 'conv' | 'salary'

  // ========== DISPLAY ==========
  function updateDisplay() {
    document.getElementById('display').value = currentInput;
  }

  function appendNumber(num) {
    if (currentInput === '0' && num !== '.') {
      currentInput = num;
    } else if (num === '.' && currentInput.includes('.')) {
      return;
    } else {
      currentInput += num;
    }
    updateDisplay();
  }

  function backspace() {
    if (currentInput.length <= 1) {
      currentInput = '0';
    } else {
      currentInput = currentInput.slice(0, -1);
    }
    updateDisplay();
  }

  function setOperator(op) {
    if (previousValue === null) {
      previousValue = parseFloat(currentInput);
    } else {
      calculate();
    }
    operator = op;
    currentInput = '0';
  }

  function calculate() {
    if (operator === null || previousValue === null) return;
    const curr = parseFloat(currentInput);
    let result = 0;
    switch (operator) {
      case '+': result = previousValue + curr; break;
      case '−': result = previousValue - curr; break;
      case '×': result = previousValue * curr; break;
      case '÷': result = curr !== 0 ? previousValue / curr : 0; break;
    }
    currentInput = parseFloat(result.toFixed(6)).toString();
    previousValue = null;
    operator = null;
    updateDisplay();
  }

  // ========== ITEMS ==========
  function addItem() {
    const value = parseFloat(currentInput);
    if (isNaN(value) || value <= 0) return;

    const name = prompt('Nombre del item (opcional):', `Item ${items.length + 1}`) || `Item ${items.length + 1}`;
    items.push({ name, price: value });
    currentInput = '0';
    updateDisplay();
    renderItems();
    recalculate();
  }

  function renderItems() {
    const container = document.getElementById('items-list');
    if (items.length === 0) {
      container.innerHTML = '<div style="color:#4a7a4a; font-size:12px;">Lista vacía...</div>';
      return;
    }
    container.innerHTML = items.map((item, i) => `
      <div class="item">
        <span class="name">${item.name}</span>
        <span class="price">$${item.price.toFixed(2)}</span>
      </div>
    `).join('');
  }

  // ========== CALCULATIONS ==========
  function recalculate() {
    const subtotal = items.reduce((sum, i) => sum + i.price, 0);

    // Descuento
    const descuentoAmount = subtotal * (descuentoPct / 100);
    const afterDiscount = subtotal - descuentoAmount;

    // Propina (sobre after discount)
    const propinaAmount = afterDiscount * (propinaPct / 100);

    // IVU (sobre after discount)
    const ivuAmount = ivuEnabled ? afterDiscount * IVU_RATE : 0;

    const totalBeforeSplit = afterDiscount + propinaAmount + ivuAmount;
    const perPerson = serrucho > 1 ? totalBeforeSplit / serrucho : totalBeforeSplit;

    // Update UI
    document.getElementById('serrucho-val').textContent = serrucho > 1 ? `$${perPerson.toFixed(2)} c/u` : 'N/A';
    document.getElementById('descuento-val').textContent = descuentoPct > 0 ? `-$${descuentoAmount.toFixed(2)}` : '$0.00';
    document.getElementById('propina-val').textContent = `$${propinaAmount.toFixed(2)}`;
    document.getElementById('ivu-val').textContent = `$${ivuAmount.toFixed(2)}`;
    document.getElementById('total').textContent = `$${totalBeforeSplit.toFixed(2)}`;

    // Buttons
    document.getElementById('serrucho-btn').textContent = serrucho > 1 ? `${serrucho}p` : 'N/A';
    document.getElementById('propina-btn').textContent = `${propinaPct}%`;
    document.getElementById('descuento-btn').textContent = descuentoPct > 0 ? `-${descuentoPct}%` : '0%';
    document.getElementById('ivu-btn').textContent = ivuEnabled ? '11.5%' : 'OFF';
  }

  // ========== CYCLES ==========
  function cycleSerrucho() {
    modalMode = 'serrucho';
    document.getElementById('modal-title').textContent = '¿Entre cuántas personas?';
    document.getElementById('modal-input').value = serrucho > 1 ? serrucho : 2;
    document.getElementById('modal').classList.add('active');
  }

  function cyclePropina() {
    const options = [0, 10, 15, 18, 20, 22, 25];
    let idx = options.indexOf(propinaPct);
    propinaPct = options[(idx + 1) % options.length];
    recalculate();
  }

  function cycleDescuento() {
    modalMode = 'descuento';
    document.getElementById('modal-title').textContent = 'Porcentaje de descuento';
    document.getElementById('modal-input').value = descuentoPct;
    document.getElementById('modal').classList.add('active');
  }

  function toggleIVU() {
    ivuEnabled = !ivuEnabled;
    recalculate();
  }

  // ========== MODAL ==========
  function closeModal() {
    document.getElementById('modal').classList.remove('active');
    modalMode = null;
  }

  function confirmModal() {
    const val = parseFloat(document.getElementById('modal-input').value);
    if (isNaN(val)) return closeModal();

    if (modalMode === 'serrucho') {
      serrucho = Math.max(1, Math.floor(val));
    } else if (modalMode === 'descuento') {
      descuentoPct = Math.min(100, Math.max(0, val));
    } else if (modalMode === 'conv') {
      // simple lbs to kg
      const kg = (val * 0.453592).toFixed(2);
      alert(`${val} lb = ${kg} kg`);
    } else if (modalMode === 'salary') {
      const weekly = val;
      const yearly = weekly * 52;
      const ss = yearly * 0.062;
      const medicare = yearly * 0.0145;
      const hacienda = yearly * 0.07; // approx
      const net = yearly - ss - medicare - hacienda;
      alert(`Bruto anual: $${yearly.toFixed(2)}\nSeguro Social: -$${ss.toFixed(2)}\nMedicare: -$${medicare.toFixed(2)}\nHacienda (est): -$${hacienda.toFixed(2)}\nNeto anual approx: $${net.toFixed(2)}`);
    }
    closeModal();
    recalculate();
  }

  // ========== BOTTOM ACTIONS ==========
  function cycleTheme() {
    document.body.classList.remove(...themes.filter(t => t));
    themeIndex = (themeIndex + 1) % themes.length;
    if (themes[themeIndex]) document.body.classList.add(themes[themeIndex]);
  }

  function openConversion() {
    modalMode = 'conv';
    document.getElementById('modal-title').textContent = 'Libras → Kilos';
    document.getElementById('modal-input').value = '';
    document.getElementById('modal').classList.add('active');
  }

  function openSalary() {
    modalMode = 'salary';
    document.getElementById('modal-title').textContent = 'Salario semanal bruto ($)';
    document.getElementById('modal-input').value = '';
    document.getElementById('modal').classList.add('active');
  }

  function generateReceipt() {
    const subtotal = items.reduce((s, i) => s + i.price, 0);
    const descuentoAmount = subtotal * (descuentoPct / 100);
    const after = subtotal - descuentoAmount;
    const propinaAmount = after * (propinaPct / 100);
    const ivuAmount = ivuEnabled ? after * IVU_RATE : 0;
    const total = after + propinaAmount + ivuAmount;

    let text = `🇵🇷 CALCULADORA PUERTO RICO\n`;
    text += `========================\n`;
    text += `Fecha: ${new Date().toLocaleString('es-PR')}\n\n`;
    text += `LISTA DE COMPRAS:\n`;
    items.forEach(i => {
      text += `• ${i.name.padEnd(18)} $${i.price.toFixed(2)}\n`;
    });
    text += `------------------------\n`;
    text += `Subtotal:          $${subtotal.toFixed(2)}\n`;
    if (descuentoPct > 0) text += `Descuento ${descuentoPct}%:   -$${descuentoAmount.toFixed(2)}\n`;
    if (propinaPct > 0) text += `Propina ${propinaPct}%:      $${propinaAmount.toFixed(2)}\n`;
    if (ivuEnabled) text += `IVU 11.5%:         $${ivuAmount.toFixed(2)}\n`;
    text += `========================\n`;
    text += `TOTAL:             $${total.toFixed(2)}\n`;
    if (serrucho > 1) text += `Por persona (${serrucho}): $${(total/serrucho).toFixed(2)}\n`;
    text += `\n¡Gracias! 🇵🇷`;

    document.getElementById('receipt-text').textContent = text;
    document.getElementById('receipt-modal').classList.add('active');
  }

  function closeReceipt() {
    document.getElementById('receipt-modal').classList.remove('active');
  }

  function copyReceipt() {
    const text = document.getElementById('receipt-text').textContent;
    navigator.clipboard.writeText(text).then(() => alert('¡Recibo copiado!'));
  }

  function clearAll() {
    items = [];
    currentInput = '0';
    previousValue = null;
    operator = null;
    serrucho = 1;
    propinaPct = 0;
    descuentoPct = 0;
    ivuEnabled = true;
    updateDisplay();
    renderItems();
    recalculate();
  }

  // Init
  renderItems();
  recalculate();
  updateDisplay();
</script>
</body>
</html>
